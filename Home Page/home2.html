<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login | VidyarthiVerse</title>
    <link rel="stylesheet" href="reset.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('assets/log2.svg') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
        }

        .main {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .navbar {
            width: 100%;
            height: 70px;
            background-color: #4a2e6f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .logo {
            color: #fff;
            font-size: 26px;
            font-weight: bold;
        }

        .menu ul {
            list-style: none;
            display: flex;
        }

        .menu ul li {
            margin: 0 5px;
        }

        .menu ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }

        .search {
            display: flex;
        }

        .srch {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            outline: none;
        }

        .btn {
            margin-left: 10px;
            padding: 5px 15px;
            border: none;
            background: #27ae60;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        .form-island {
            width: 400px;
            background-color: #4a2e6f;
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            position: absolute;
            top: 55%;
            right: 15%;
            transform: translateY(-50%);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: #ffffff;
        }

        .form-island h2 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        .form-island p {
            color: #f1f1f1;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .form-island input {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
        }

        .btnn {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .form-island .link {
            margin-top: 15px;
            font-size: 14px;
        }

        .form-island .link a {
            color: #fff;
            text-decoration: underline;
        }

        .form-island .liw {
            text-align: center;
            margin-top: 20px;
        }

        .form-island .icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .form-island .icons a {
            color: #fff;
            font-size: 22px;
        }

        /* Responsive Fix */
        @media screen and (max-width: 768px) {
            .form-island {
                width: 90%;
                right: 50%;
                transform: translate(50%, -50%);
            }

            .navbar {
                padding: 0 10px;
            }
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="navbar">
            <div class="icon">
                <h2 class="logo">VidyarthiVerse</h2>
            </div>

            <div class="menu">
                <ul>
                    <li><a href="code.html">HOME</a></li>
                    <li><a href="aboutus.html">ABOUT</a></li>
                    <li><a href="home2.html">JOIN</a></li>
                    <li><a href="dashboard.html">SERVICE</a></li>
                    <li><a href="contactus.html">CONTACT</a></li>
                </ul>
            </div>

            <div class="search">
                <input class="srch" type="search" placeholder="Type to text">
                <button class="btn">Search</button>
            </div>
        </div>

        <div class="form-island">
            <h2>Welcome Back!</h2>
            <p>Login to your VidyarthiVerse dashboard ✨</p>
            <input type="email" id="email" placeholder="Enter Email Here" required>
            <input type="password" id="password" placeholder="Enter Password Here" required>
            <button class="btnn" onclick="loginUser()">Login</button>

            <p class="link">Don't have an account?<br>
                <a href="signup.html">Sign up</a> here
            </p>
            <p class="liw">Log in with</p>

            <div class="icons">
                <a href="#"><ion-icon name="logo-facebook"></ion-icon></a>
                <a href="#"><ion-icon name="logo-instagram"></ion-icon></a>
                <a href="#"><ion-icon name="logo-twitter"></ion-icon></a>
                <a href="#"><ion-icon name="logo-google"></ion-icon></a>
                <a href="#"><ion-icon name="logo-skype"></ion-icon></a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons.js"></script>

    <script>
        async function loginUser() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!email || !password) {
                alert("Please fill in all fields.");
                return;
            }

            try {
                const response = await fetch("http://localhost:5000/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem("token", data.token);
                    alert("Login successful!");
                    window.location.href = "dashboard.html";
                } else {
                    alert(data.message || "Login failed. Please try again.");
                }
            } catch (error) {
                console.error("Login Error:", error);
                alert("Something went wrong. Check console for details.");
            }
        }
    </script>
</body>

</html>
