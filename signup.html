<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup | VidyarthiVerse</title>
  <link rel="stylesheet" href="signup.css"/>
  <script defer>
    async function signupUser() {
      const name = document.getElementById("fullName").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!name || !email || !password) {
        alert("Please fill in all required fields.");
        return;
      }

      try {
        const response = await fetch("http://localhost:5000/api/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem("token", data.token);
          alert("Signup successful! Redirecting to your dashboard...");
          window.location.href = "home2.html"; // <-- updated redirect
        } else {
          alert(data.message || "Signup failed. Try again.");
        }
      } catch (error) {
        console.error("Signup Error:", error);
        alert("Something went wrong. Check console for details.");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("signupForm");
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        signupUser();
      });

      const nextBtns = document.querySelectorAll(".next-btn");
      const prevBtns = document.querySelectorAll(".prev-btn");
      const steps = document.querySelectorAll(".form-step");
      const stepIndicators = document.querySelectorAll(".step");
      let currentStep = 0;

      function updateFormSteps() {
        steps.forEach((step, index) => {
          step.classList.toggle("active", index === currentStep);
          stepIndicators[index].classList.toggle("active", index <= currentStep);
        });
      }

      nextBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          if (currentStep < steps.length - 1) currentStep++;
          updateFormSteps();
        });
      });

      prevBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          if (currentStep > 0) currentStep--;
          updateFormSteps();
        });
      });
    });
  </script>
</head>
<body>
     <!-- NAVBAR -->
  <div class="navbar">
    <div class="icon">
      <h2 class="logo">VidyarthiVerse</h2>
    </div>
    <div class="menu">
      <ul>
        <li><a href="code.html">HOME</a></li>
        <li><a href="aboutus.html">ABOUT</a></li>
        <li><a href="home2.html">JOIN</a></li>
        <li><a href="dashboard.html">SERVICE</a></li>
        <li><a href="contactus.html">CONTACT</a></li>
      </ul>
    </div>
    <div class="search">
      <input class="srch" type="search" placeholder="Search...">
      <button class="btn">Go</button>
    </div>
  </div>
  
  <div class="background-overlay">
    <div class="signup-container left-aligned">
      <h2>Join <span>VidyarthiVerse</span></h2>

      <div class="progress-bar">
        <div class="step active">1</div>
        <div class="step">2</div>
        <div class="step">3</div>
      </div>

      <form id="signupForm">
        <!-- Step 1 -->
        <div class="form-step active">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your full name" required>

          <label for="email">Email ID</label>
          <input type="email" id="email" placeholder="Enter your email" required>

          <label for="education">Education Status</label>
          <select id="education" required>
            <option value="">Select your status</option>
            <option value="school">School Student</option>
            <option value="college">College Student</option>
            <option value="graduate">Graduate</option>
            <option value="other">Other</option>
          </select>

          <label for="institution">Institution Name</label>
          <input type="text" id="institution" placeholder="Enter your institution name" required>

          <button type="button" class="next-btn">Next</button>
        </div>

        <!-- Step 2 -->
        <div class="form-step">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username" required>

          <label for="password">Create Password</label>
          <input type="password" id="password" placeholder="Enter password" required>

          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm password" required>

          <button type="button" class="prev-btn">Back</button>
          <button type="button" class="next-btn">Next</button>
        </div>

        <!-- Step 3 -->
        <div class="form-step">
          <p>Review your details and click "Sign Up" to complete registration.</p>

          <button type="button" class="prev-btn">Back</button>
          <button type="submit" class="submit-btn">Sign Up</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
